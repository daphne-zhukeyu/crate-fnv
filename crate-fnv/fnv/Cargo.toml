[package]
name = "fnv"
version = "1.0.7"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
description = "fnv 1.0.7 annotated for Verus; see README-VERUS.md"
license = "Apache-2.0 / MIT"
readme = "README.md"
repository = "https://github.com/servo/rust-fnv"
publish = false

[lib]
name = "fnv"
path = "lib.rs"

[features]
default = ["std"]
std = []

[dependencies]
# Supplies the `verus!` macro and `vstd::prelude` for plain `cargo build`/`cargo test`
# (ghost code is erased). Matches Verus release 0.2026.10.04.426d8b0.
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }
